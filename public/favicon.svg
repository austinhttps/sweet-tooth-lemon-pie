<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <!-- Bottle Satin Pastel Lemon Gradient -->
    <linearGradient id="lemonBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5b8" />
      <stop offset="50%" stop-color="#faeb96" />
      <stop offset="100%" stop-color="#f0d674" />
    </linearGradient>
    
    <!-- Chocolate Segment Bevel Gradient -->
    <linearGradient id="squareBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.15" />
    </linearGradient>

    <!-- Metallic Gold Sprayer Gradient -->
    <linearGradient id="goldSpray" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="35%" stop-color="#fde047" />
      <stop offset="70%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#854d0e" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Gold Atomizer Pump & Nozzle -->
  <g filter="url(#softShadow)">
    <!-- Neck Collar -->
    <rect x="52" y="18" width="24" height="6" rx="2" fill="url(#goldSpray)" />
    <!-- Pump Actuator -->
    <rect x="55" y="10" width="18" height="9" rx="2" fill="url(#goldSpray)" />
    <!-- Spray Hole -->
    <circle cx="64" cy="14" r="1.5" fill="#1c1917" />
  </g>

  <!-- Main Chocolate Bar Flacon (3 columns x 4 rows) -->
  <g filter="url(#softShadow)">
    <!-- Base Core Slab -->
    <rect x="24" y="24" width="80" height="96" rx="6" fill="url(#lemonBody)" stroke="#ecd67a" stroke-width="1.5" />

    <!-- 12 Beveled Chocolate Segments -->
    <!-- Row 1 (Cap) -->
    <rect x="28" y="28" width="21" height="19" rx="2" fill="url(#lemonBody)" stroke="#e4cb6b" stroke-width="0.8" />
    <rect x="28" y="28" width="21" height="19" rx="2" fill="url(#squareBevel)" />
    <rect x="53.5" y="28" width="21" height="19" rx="2" fill="url(#lemonBody)" stroke="#e4cb6b" stroke-width="0.8" />
    <rect x="53.5" y="28" width="21" height="19" rx="2" fill="url(#squareBevel)" />
    <rect x="79" y="28" width="21" height="19" rx="2" fill="url(#lemonBody)" stroke="#e4cb6b" stroke-width="0.8" />
    <rect x="79" y="28" width="21" height="19" rx="2" fill="url(#squareBevel)" />

    <!-- Cap Seam Cut Line -->
    <line x1="24" y1="51" x2="104" y2="51" stroke="#d4b44c" stroke-width="1" stroke-dasharray="1 0" />

    <!-- Row 2 -->
    <rect x="28" y="53" width="21" height="19" rx="2" fill="url(#lemonBody)" stroke="#e4cb6b" stroke-width="0.8" />
    <rect x="28" y="53" width="21" height="19" rx="2" fill="url(#squareBevel)" />
    <rect x="53.5" y="53" width="21" height="19" rx="2" fill="url(#lemonBody)" stroke="#e4cb6b" stroke-width="0.8" />
    <rect x="53.5" y="53" width="21" height="19" rx="2" fill="url(#squareBevel)" />
    <rect x="79" y="53" width="21" height="19" rx="2" fill="url(#lemonBody)" stroke="#e4cb6b" stroke-width="0.8" />
    <rect x="79" y="53" width="21" height="19" rx="2" fill="url(#squareBevel)" />

    <!-- Row 3 -->
    <rect x="28" y="75" width="21" height="19" rx="2" fill="url(#lemonBody)" stroke="#e4cb6b" stroke-width="0.8" />
    <rect x="28" y="75" width="21" height="19" rx="2" fill="url(#squareBevel)" />
    <rect x="53.5" y="75" width="21" height="19" rx="2" fill="url(#lemonBody)" stroke="#e4cb6b" stroke-width="0.8" />
    <rect x="53.5" y="75" width="21" height="19" rx="2" fill="url(#squareBevel)" />
    <rect x="79" y="75" width="21" height="19" rx="2" fill="url(#lemonBody)" stroke="#e4cb6b" stroke-width="0.8" />
    <rect x="79" y="75" width="21" height="19" rx="2" fill="url(#squareBevel)" />

    <!-- Row 4 -->
    <rect x="28" y="97" width="21" height="19" rx="2" fill="url(#lemonBody)" stroke="#e4cb6b" stroke-width="0.8" />
    <rect x="28" y="97" width="21" height="19" rx="2" fill="url(#squareBevel)" />
    <rect x="53.5" y="97" width="21" height="19" rx="2" fill="url(#lemonBody)" stroke="#e4cb6b" stroke-width="0.8" />
    <rect x="53.5" y="97" width="21" height="19" rx="2" fill="url(#squareBevel)" />
    <rect x="79" y="97" width="21" height="19" rx="2" fill="url(#lemonBody)" stroke="#e4cb6b" stroke-width="0.8" />
    <rect x="79" y="97" width="21" height="19" rx="2" fill="url(#squareBevel)" />
  </g>

  <!-- Sparkle Accent -->
  <path d="M106 18 Q108 24 114 26 Q108 28 106 34 Q104 28 98 26 Q104 24 106 18 Z" fill="#fbbf24" opacity="0.9" />
</svg>